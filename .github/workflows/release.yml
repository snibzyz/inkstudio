name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# INKSTUDIO auto-update flow:
#   - Win NSIS installer + Portable: built on windows-latest
#                                    → electron-updater (NSIS) auto-update via GitHub Releases
#   - Mac dmg + zip: split per arch — macos-13 (Intel) + macos-latest (Apple Silicon)
#                    → ffmpeg-static ติดตั้ง binary ของ arch ตัวเอง ตอน pnpm install
#                    → cross-build ไม่ได้ (arm64 host → x64 dmg จะมี arm64 ffmpeg)
jobs:
  package-win:
    name: Package Windows (NSIS + Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version with tag
        shell: bash
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME:-}"
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "skip: not a vX.Y.Z tag ($REF)"
            exit 0
          fi
          VERSION="${REF#v}"
          for f in package.json .app/shell/package.json; do
            node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('$f','utf8'));j.version='$VERSION';fs.writeFileSync('$f',JSON.stringify(j,null,2)+'\n');"
            echo "  $f -> $(node -e "console.log(require('./$f').version)")"
          done

      - name: Build renderer
        working-directory: .app/shell
        run: pnpm build

      - name: Package Windows (NSIS + Portable)
        working-directory: .app/shell
        run: pnpm exec electron-builder --win nsis portable --publish never

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            .app/shell/release/INKSTUDIO-Setup-*.exe
            .app/shell/release/INKSTUDIO-Portable-*.exe
            .app/shell/release/*.blockmap
            .app/shell/release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS = arm64-only (Apple Silicon, Mac 2020+).
  # Intel (x64) ถูกตัดออก: ต้องใช้ macos-13 runner (จัดสรรช้า/ขาดแคลน) + ต้องมี job
  # รวม latest-mac.yml ของสอง arch เป็นไฟล์เดียว (ไม่งั้นแต่ละ arch เขียนทับกัน
  # ทำ auto-update อีก arch พัง). ถ้าจะเพิ่ม Intel กลับ: คืน matrix 2 arch + เพิ่ม
  # merge-manifest job. ดู git history ของไฟล์นี้
  package-mac:
    name: Package macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest   # Apple Silicon — installs darwin-arm64 ffmpeg
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version with tag
        shell: bash
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME:-}"
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "skip: not a vX.Y.Z tag ($REF)"
            exit 0
          fi
          VERSION="${REF#v}"
          for f in package.json .app/shell/package.json; do
            node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('$f','utf8'));j.version='$VERSION';fs.writeFileSync('$f',JSON.stringify(j,null,2)+'\n');"
            echo "  $f -> $(node -e "console.log(require('./$f').version)")"
          done

      - name: Verify ffmpeg-static arch + runtime works
        shell: bash
        working-directory: .app/shell
        run: |
          set -euo pipefail
          FFMPEG="$(node -p "require('ffmpeg-static')")"
          echo "ffmpeg path: $FFMPEG"
          [ -f "$FFMPEG" ] || { echo "ERROR: ffmpeg-static binary not found"; exit 1; }
          chmod +x "$FFMPEG" 2>/dev/null || true
          ARCH_INFO="$(file "$FFMPEG")"
          echo "file info: $ARCH_INFO"
          case "${{ matrix.arch }}" in
            x64)   echo "$ARCH_INFO" | grep -E "x86_64" || { echo "FAIL: expected x86_64 ffmpeg"; exit 1; } ;;
            arm64) echo "$ARCH_INFO" | grep -E "arm64"  || { echo "FAIL: expected arm64 ffmpeg";  exit 1; } ;;
          esac
          # Runtime check — spawn จริง
          echo "--- ffmpeg -version ---"
          "$FFMPEG" -version | head -3
          echo "--- ffmpeg encode test (sine → mp4) ---"
          "$FFMPEG" -nostdin -y -f lavfi -i "testsrc=duration=0.5:size=128x128:rate=15" -f lavfi -i "sine=frequency=440:duration=0.5" -c:v libx264 -preset ultrafast -c:a aac /tmp/_test.mp4 2>&1 | tail -3
          [ -s /tmp/_test.mp4 ] || { echo "FAIL: ffmpeg encode produced empty file"; exit 1; }
          echo "ffmpeg encode test passed ($(wc -c < /tmp/_test.mp4) bytes)"
          rm -f /tmp/_test.mp4

      - name: Build renderer
        working-directory: .app/shell
        run: pnpm build

      - name: Package macOS (dmg + zip)
        working-directory: .app/shell
        run: pnpm exec electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            .app/shell/release/INKSTUDIO-*.dmg
            .app/shell/release/INKSTUDIO-*.zip
            .app/shell/release/*.blockmap
            .app/shell/release/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
